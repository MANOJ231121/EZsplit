server:
  port: 8080

spring:
  application:
    name: ezsplit-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ezsplit}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
              - openid

app:
  jwt:
    secret: ${JWT_SECRET:EzSplitSecretKeyForJWTGenerationThatIsAtLeast256BitsLongForHS256Algorithm9876543210}
    expiration-ms: 864000000 # 10 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
